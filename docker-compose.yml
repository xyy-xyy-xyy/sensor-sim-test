# 启动：docker compose up -d --build
# 灌数据：docker compose run --rm seed
# 宿主机端口 3307 用于避开本机已有的 MySQL（3306）

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sensor}
      MYSQL_USER: ${MYSQL_USER:-sensor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sensor_dev_pwd}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sensor}
      MYSQL_USER: ${MYSQL_USER:-sensor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sensor_dev_pwd}
      # 仅用于集成测试创建独立测试库 sensor_test（业务账号无权建库）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"

  # 一次性任务：用 C 生成器灌 500 帧进 MySQL（默认不启动，按需 run）
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sensor}
      MYSQL_USER: ${MYSQL_USER:-sensor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sensor_dev_pwd}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    command:
      - sh
      - -c
      - /app/sensor_sim --frames 500 --seed 42 | python /app/src/consumer.py --reset

volumes:
  mysql_data:
