name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v --tb=short

  # MySQL 集成测试：验证生产路径（src/database.py）在真实 MySQL 8 上可用，
  # 覆盖单测（SQLite 夹具）无法覆盖的方言差异（rowcount / DECIMAL / DATETIME 等）
  mysql-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sensor
          MYSQL_USER: sensor
          MYSQL_PASSWORD: sensor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run MySQL integration tests
        env:
          PYTHONPATH: src
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: sensor
          MYSQL_PASSWORD: sensor
          MYSQL_DATABASE: sensor_test
          MYSQL_ROOT_PASSWORD: root
          DB_CONNECT_RETRIES: "15"
        run: python -m pytest tests/test_mysql_integration.py -v --tb=short
